name: jee_planner
description: "Personal JEE Daily Planner - Flutter Android App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  intl: ^0.19.0
  provider: ^6.1.0
  flutter_local_notifications: ^15.1.0
  android_alarm_manager_plus: ^3.1.2
  audioplayers: ^5.2.0
  fl_chart: ^0.65.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_linter: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/
